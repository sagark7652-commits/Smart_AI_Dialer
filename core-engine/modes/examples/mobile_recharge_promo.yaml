company:
  name: SwiftTel 5G
  description: Leading national telecom provider offering ultra high-speed 5G data and voice across India.
mode: telecaller_sales
product:
  name: 5G Unlimited Annual Super Plan
  price: ₹1,999 for full 365 days (special discount from ₹2,999, less than ₹166 per month)
  benefits:
  - 2.5 GB high-speed 5G data every single day (total over 912 GB data)
  - Unlimited voice calling to any network in India with zero roaming
  - 100 free SMS per day
  - Free Disney+ Hotstar and Amazon Prime Video Mobile subscriptions for 1 full year
  - Unlimited 5G high-speed connectivity up to 1 Gbps
