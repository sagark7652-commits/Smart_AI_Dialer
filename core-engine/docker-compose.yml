services:
  calling-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calling-agent-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://agent_user:secure_pg_password@postgres:5432/calling_agent_db
      - LOG_LEVEL=INFO
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - agent_recordings:/app/recordings
      - agent_transcripts:/app/transcripts
    networks:
      - calling_agent_network

  postgres:
    image: postgres:16-alpine
    container_name: calling-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: secure_pg_password
      POSTGRES_DB: calling_agent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d calling_agent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calling_agent_network

  redis:
    image: redis:7-alpine
    container_name: calling-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - calling_agent_network

volumes:
  postgres_data:
  redis_data:
  agent_recordings:
  agent_transcripts:

networks:
  calling_agent_network:
    driver: bridge
